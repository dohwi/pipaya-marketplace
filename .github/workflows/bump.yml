name: bump
# Follow the releases: move every listing to the newest `<id>-v<version>` tag of its repo and commit the result.
# Runs when an extension repo announces a release (repository_dispatch), every hour as a fallback, or by hand.
on:
  repository_dispatch:
    types: [extension-released]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bump
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/bump.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: bun test && bun scripts/validate.ts
      - name: commit
        run: |
          git diff --quiet && exit 0
          moved=$(git diff -U0 marketplace.json | sed -n 's/^+ *"ref": "\(.*\)",$/\1/p' | paste -sd ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json index.json
          git commit -m "update: ${moved}"
          git push
