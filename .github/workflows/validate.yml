name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test
      - run: bun scripts/validate.ts
      - run: bun scripts/build-index.ts --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
